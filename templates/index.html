<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maslow 4 Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.85rem;
      color: #a0a8c0;
      margin-top: 4px;
    }

    #chat-container {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 24px 16px 16px;
      gap: 12px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      max-height: calc(100vh - 220px);
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }

    .message .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #1a73e8;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .bubble {
      background: #fff;
      color: #202124;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 4px;
    }

    .message .label {
      font-size: 0.72rem;
      color: #888;
      margin-bottom: 4px;
    }

    /* Typing indicator */
    .typing-indicator .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }

    .typing-indicator .dot {
      width: 8px;
      height: 8px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    #input-area {
      display: flex;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid #e0e0e0;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #d0d0d0;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      background: #fff;
      line-height: 1.4;
    }

    #user-input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }

    #send-btn {
      background: #1a73e8;
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      align-self: flex-end;
    }

    #send-btn:hover:not(:disabled) { background: #1558b0; }
    #send-btn:disabled { background: #a0a8c0; cursor: not-allowed; }

    #send-btn svg { fill: #fff; width: 20px; height: 20px; }

    .error-bubble {
      background: #fce8e6;
      border: 1px solid #f28b82;
      color: #c62828;
    }

    #welcome {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin: auto;
      padding: 32px 16px;
      line-height: 1.6;
    }

    #welcome strong { color: #444; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 Maslow 4 Assistant</h1>
    <p>Ask me anything about your Maslow 4 CNC router</p>
  </header>

  <div id="chat-container">
    <div id="messages">
      <div id="welcome">
        <strong>Welcome to the Maslow 4 Assistant!</strong><br />
        Ask questions about calibration, belts, firmware, connectivity, cutting, and more.
      </div>
    </div>

    <div id="input-area">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ask a question about your Maslow 4…"
        aria-label="Chat message"
      ></textarea>
      <button id="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const welcomeEl = document.getElementById('welcome');

    // Conversation history sent to the backend
    const history = [];

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendMessage(role, text, isError = false) {
      if (welcomeEl) welcomeEl.remove();

      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = role === 'user' ? 'You' : 'Maslow 4 Assistant';

      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (isError ? ' error-bubble' : '');
      bubble.textContent = text;

      wrapper.appendChild(label);
      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function showTyping() {
      const wrapper = document.createElement('div');
      wrapper.className = 'message assistant typing-indicator';

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = 'Maslow 4 Assistant';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot';
        bubble.appendChild(dot);
      }

      wrapper.appendChild(label);
      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;

      appendMessage('user', text);
      history.push({ role: 'user', content: text });

      const typingEl = showTyping();

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });

        const data = await response.json();
        typingEl.remove();

        if (!response.ok || data.error) {
          appendMessage('assistant', data.error || 'An error occurred. Please try again.', true);
          // Remove the failed user message from history so user can retry
          history.pop();
        } else {
          appendMessage('assistant', data.reply);
          history.push({ role: 'assistant', content: data.reply });
        }
      } catch (err) {
        typingEl.remove();
        appendMessage('assistant', 'Network error. Please check your connection and try again.', true);
        history.pop();
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    // Send on Enter (Shift+Enter for newline)
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendMessage();
      }
    });

    sendBtn.addEventListener('click', () => {
      if (!sendBtn.disabled) sendMessage();
    });
  </script>
</body>
</html>
